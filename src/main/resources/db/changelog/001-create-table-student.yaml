databaseChangeLog:
  - changeSet:
      id: 001
      author: fouda
      preConditions:
        - onFail: MARK_RAN
          dbms:
            type: postgresql,h2
      changes:
        - createTable:
            tableName: student
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(255)
              - column:
                  name: last_name
                  type: VARCHAR(255)
              - column:
                  name: email
                  type: VARCHAR(255)
